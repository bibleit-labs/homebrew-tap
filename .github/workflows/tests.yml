name: Tap validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-bot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: Homebrew/actions/setup-homebrew@eb02c69dbabdb66ff183c614f4ce7ab3c077592c
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Tap syntax and style
        run: brew test-bot --only-tap-syntax
      - name: Formula updater regressions
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
