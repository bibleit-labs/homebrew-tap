name: Tap validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-bot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: Homebrew/actions/setup-homebrew@c262868c096d909fc278daa87ed9772967331ea3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Trust the formula under test
        run: brew trust --formula bibleit-labs/tap/bibleit-cli
      - name: Tap syntax and style
        run: brew test-bot --only-tap-syntax
      - name: Formula updater regressions
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
