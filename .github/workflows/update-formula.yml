name: Update release formula
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published CLI tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
permissions: {}
concurrency:
  group: formula-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate version before downloads
        run: python3 scripts/update_formula.py --version "$VERSION" --validate-version
      - name: Download published CLI formula and archives
        env:
          GH_TOKEN: ${{ secrets.BIBLEIT_CLI_READ_TOKEN || github.token }}
        run: |
          gh release view "$VERSION" --repo bibleit-labs/bibleit-cli --json isDraft --jq 'if .isDraft then error("draft release is not publishable") else . end'
          gh release download "$VERSION" --repo bibleit-labs/bibleit-cli --dir artifacts \
            --pattern 'bibleit-cli.rb' --pattern 'manifest.json' --pattern 'checksums.txt' \
            --pattern "bibleit_${VERSION#v}_darwin_*.tar.gz" \
            --pattern "bibleit_${VERSION#v}_linux_*.tar.gz"
      - name: Verify archives and update generated formula
        run: python3 scripts/update_formula.py --version "$VERSION" --assets artifacts
      - name: Open formula update PR
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- Formula/bibleit-cli.rb; then
            echo 'Formula already matches the release'
            exit 0
          fi
          branch="release/$VERSION"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/bibleit-cli.rb
          git commit -m "chore(formula): update bibleit-cli to $VERSION"
          git push origin "$branch"
          gh pr create --base "$BASE_BRANCH" --head "$branch" \
            --title "chore(formula): update bibleit-cli to $VERSION" \
            --body 'Updates the CLI-generated formula after verifying published archive checksums. Review and run tap validation before merging; no automatic merge.'
