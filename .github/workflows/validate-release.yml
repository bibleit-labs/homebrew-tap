name: Validate Homebrew package
on:
  workflow_dispatch:
    inputs:
      version:
        description: CLI version matching this branch's formula
        required: true
        type: string
      candidate_run_id:
        description: Successful public CLI candidate run ID; empty selects a published release
        required: false
        default: ''
        type: string
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      EXPECTED_HOMEBREW_RUNNER: ${{ matrix.os }}
      VERSION: ${{ inputs.version }}
      CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate version and public release access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/update_formula.py --version "$VERSION" --validate-version
          bash scripts/check_cli_access.sh
          if [ -n "$CANDIDATE_RUN" ]; then
            [[ "$CANDIDATE_RUN" =~ ^[0-9]+$ ]] || { echo 'Invalid candidate run ID'; exit 1; }
            gh api "repos/bibleit-labs/bibleit-cli/actions/runs/$CANDIDATE_RUN" --silent
          fi
          if [ -z "$CANDIDATE_RUN" ]; then gh release view "$VERSION" --repo bibleit-labs/bibleit-cli --json isDraft --jq 'if .isDraft then error("release is still a draft") else . end'; fi
      - uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04
        with:
          token: ${{ github.token }}
      - name: Download and verify released formula and archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$CANDIDATE_RUN" ]; then
            [[ "$CANDIDATE_RUN" =~ ^[0-9]+$ ]] || { echo 'Invalid candidate run ID'; exit 1; }
            gh api "repos/bibleit-labs/bibleit-cli/actions/runs/$CANDIDATE_RUN" > candidate-run.json
            python3 - <<'PYRUN'
          import json
          run = json.load(open('candidate-run.json'))
          assert run['repository']['full_name'] == 'bibleit-labs/bibleit-cli'
          assert run['path'] == '.github/workflows/release-candidate.yml'
          assert run['event'] == 'workflow_dispatch'
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          PYRUN
            gh run download "$CANDIDATE_RUN" --repo bibleit-labs/bibleit-cli --name candidate-assets --dir artifacts
            python3 - <<'PYINPUT'
          import json, os
          run = json.load(open('candidate-run.json'))
          manifest = json.load(open('artifacts/manifest.json'))
          assert manifest['commit'] == run['head_sha']
          assert manifest['version'] == os.environ['VERSION']
          PYINPUT
          else
            gh release download "$VERSION" --repo bibleit-labs/bibleit-cli --dir artifacts \
              --pattern 'bibleit-cli.rb' --pattern 'manifest.json' --pattern 'checksums.txt' \
              --pattern "bibleit_${VERSION#v}_darwin_*.tar.gz" \
              --pattern "bibleit_${VERSION#v}_linux_*.tar.gz"
          fi
          python3 scripts/update_formula.py --version "$VERSION" --assets artifacts --output verified.rb
          cmp verified.rb Formula/bibleit-cli.rb
      - name: Install, test, reinstall and uninstall in isolated Homebrew prefix
        run: python3 scripts/check_released_homebrew.py --helper scripts/check_homebrew.py --assets artifacts --formula Formula/bibleit-cli.rb --report build/validation/homebrew.json
      - name: Save validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: homebrew-${{ matrix.os }}
          path: build/validation/
          if-no-files-found: ignore
