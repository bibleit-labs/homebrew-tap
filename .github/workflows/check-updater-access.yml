name: Check updater access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Verify CLI release read access without changing repositories
        env:
          GH_TOKEN: ${{ secrets.BIBLEIT_CLI_READ_TOKEN || github.token }}
        run: bash scripts/check_cli_access.sh
