name: Check updater access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify CLI release read access without changing repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check_cli_access.sh
