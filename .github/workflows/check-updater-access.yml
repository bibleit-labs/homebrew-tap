name: Check updater access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify CLI release read access without changing repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check_cli_access.sh
